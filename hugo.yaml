baseURL: "https://andreasnissen.dev/"
locale: "en-us"
title: "Andreas Nissen"
copyright: "© Andreas Nissen"
enableRobotsTXT: true
enableGitInfo: false

pagination:
  pagerSize: 12

taxonomies:
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - LLMSTXT
  section:
    - HTML
    - RSS
    - MARKDOWN
  page:
    - HTML
    - MARKDOWN

outputFormats:
  MARKDOWN:
    mediaType: "text/markdown"
    baseName: "index"
    isPlainText: true
    permalinkable: true
  LLMSTXT:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    permalinkable: false

params:
  description: "Practical AI architecture, agent evaluation, and enterprise adoption, with projects and writing by Andreas Nissen."
  author: "Andreas Nissen"
  socialImage: "/images/social/homepage-v2.png"
  socialImageAlt: "Andreas Nissen. AI Architecture. Projects, Demos, and Writing. andreasnissen.dev."
  githubURL: "https://github.com/Andreasniss"
  linkedinURL: "https://www.linkedin.com/in/andreasnissen"
  sourceURL: "https://github.com/Andreasniss/personal-website"
  projectDisclaimer: "These are personal projects, not affiliated with or endorsed by my employer, AWS. Views and opinions are my own."
  viewsDisclaimer: "Personal projects and views are my own and do not represent AWS."

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false

menus:
  main:
    - name: "Start Here"
      pageRef: "/start-here"
      weight: 5
    - name: "Projects"
      pageRef: "/projects"
      weight: 10
    - name: "Writing"
      pageRef: "/writing"
      weight: 20
    - name: "Talks & Workshops"
      parent: "about"
      pageRef: "/talks"
      weight: 30
    - name: "Selected Impact"
      parent: "about"
      pageRef: "/impact"
      weight: 35
    - name: "Work I Love"
      parent: "about"
      pageRef: "/work-i-love"
      weight: 40
    - name: "About"
      identifier: "about"
      pageRef: "/about"
      weight: 50
