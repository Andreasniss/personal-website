baseURL: "https://andreasnissen.dev/"
locale: "en-us"
title: "Andreas Nissen"
copyright: "© Andreas Nissen"
enableRobotsTXT: true
enableGitInfo: false

pagination:
  pagerSize: 12

taxonomies:
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - LLMSTXT
  section:
    - HTML
    - RSS
    - MARKDOWN
  page:
    - HTML
    - MARKDOWN

outputFormats:
  MARKDOWN:
    mediaType: "text/markdown"
    baseName: "index"
    isPlainText: true
    permalinkable: true
  LLMSTXT:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    permalinkable: false

params:
  description: "Enterprise AI architecture, agent reliability, evaluation, and governed execution."
  author: "Andreas Nissen"
  socialImage: "/images/social/default.png"
  socialImageAlt: "Andreas Nissen, enterprise AI architecture, agent reliability, evaluation, and governed execution."
  githubURL: "https://github.com/Andreasniss"
  linkedinURL: "https://www.linkedin.com/in/andreasnissen"
  sourceURL: "https://github.com/Andreasniss/personal-website"
  viewsDisclaimer: "Personal projects and views are my own and do not represent AWS."

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false

menus:
  main:
    - name: "Projects"
      pageRef: "/projects"
      weight: 10
    - name: "Writing"
      pageRef: "/writing"
      weight: 20
    - name: "Talks"
      pageRef: "/talks"
      weight: 30
    - name: "Impact"
      pageRef: "/impact"
      weight: 35
    - name: "Work I Love"
      pageRef: "/work-i-love"
      weight: 40
    - name: "About"
      pageRef: "/about"
      weight: 50
