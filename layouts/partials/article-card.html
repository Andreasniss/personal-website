<article class="entry-card writing-card" data-search="{{ printf "%s %s %s" .Title .Description (delimit .Params.tags " ") | lower }}" data-topic="{{ .Params.primaryTopic | urlize }}">
  {{ with .Params.image }}<a class="card-media" href="{{ $.RelPermalink }}" tabindex="-1" aria-hidden="true"><img src="{{ . | relURL }}" alt="" loading="lazy"></a>{{ end }}
  <div class="card-body">
  <div class="entry-meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
    <span>{{ .Params.primaryTopic }}</span>
    <span>{{ .ReadingTime }} min read</span>
    {{ with .Params.linkedinURL }}<span>LinkedIn version</span>{{ end }}
    {{ with .Params.xURL }}<span>X version</span>{{ end }}
  </div>
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p>{{ .Description }}</p>
  <a class="action-link" href="{{ .RelPermalink }}" aria-label="Read {{ .Title }}"><img src="{{ "icons/article.svg" | relURL }}" alt="">Read article</a>
  </div>
</article>
