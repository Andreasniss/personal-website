<article class="entry-card">
  <div class="entry-meta">
    <span>{{ .Params.format }}</span>
    <span>By {{ .Params.creator }}</span>
  </div>
  <h3><a href="{{ .Params.sourceURL }}">{{ .Title }}</a></h3>
  <p>{{ .Description }}</p>
  {{ with .Params.why }}<p><strong>Why I recommend it:</strong> {{ . }}</p>{{ end }}
  <div class="proof-actions">
    <a class="action-link" href="{{ .Params.sourceURL }}" rel="noreferrer" aria-label="Open the original source for {{ .Title }}"><img src="{{ "icons/external-link.svg" | relURL }}" alt="">Visit original</a>
    {{ with .Params.xURL }}<a class="action-link" href="{{ . }}" rel="noreferrer"><img src="{{ "icons/x-twitter.svg" | relURL }}" alt="">Follow on X</a>{{ end }}
  </div>
</article>
