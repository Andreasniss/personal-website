<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Andreas Nissen, home">
      <span class="brand-mark" aria-hidden="true">AN</span>
      <span class="brand-name">Andreas Nissen</span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <a class="header-cta" href="{{ site.Params.linkedinURL }}" rel="me noreferrer">Get in touch</a>
  </div>
</header>
