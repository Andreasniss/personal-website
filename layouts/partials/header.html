<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Andreas Nissen, home">
      <img class="brand-mark" src="{{ "images/profile-mark.png" | relURL }}" width="42" height="42" alt="">
      <span class="brand-name">Andreas Nissen</span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if eq .Name "Work I Love" }} aria-label="Work I love"{{ end }}{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>
          {{- if eq .Name "Work I Love" -}}
            Work I <span class="heart-mark" aria-hidden="true">♥</span>
          {{- else -}}
            {{ .Name }}
          {{- end -}}
        </a>
      {{ end }}
    </nav>
    <a class="header-cta" href="{{ site.Params.linkedinURL }}" rel="me noreferrer" aria-label="Connect on LinkedIn">LinkedIn</a>
  </div>
</header>
