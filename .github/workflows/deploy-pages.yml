name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Hugo Extended
        run: |
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

      - name: Validate content
        run: node scripts/check-content.mjs

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: hugo --gc --minify

      - name: Validate production URLs
        run: |
          # Match retired site URLs and root-relative paths, not GitHub source links.
          if grep -R -E 'https?://(andreasnissen\.dev|andreasniss\.github\.io)/personal-website/|(^|[^[:alnum:]_.:/-])/personal-website/' public; then
            echo "Generated site still contains the retired GitHub Pages subpath."
            exit 1
          fi

      - name: Validate built site
        run: node scripts/check-built-site.mjs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
