<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">The complete token cost of an agent tool path</title>
  <desc id="desc">Definitions, selection, arguments, results, round trips, and recovery contribute to total cost.</desc>
  <rect width="1200" height="700" fill="#141817"/>
  <text x="70" y="80" fill="#f4f1ea" font-family="Georgia,serif" font-size="50">Count the complete tool path</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(70 160)">
      <rect width="160" height="130" rx="18" fill="#1d2321" stroke="#45aaa2" stroke-width="2"/>
      <text x="80" y="58" text-anchor="middle" fill="#72cfc7" font-size="22" font-weight="700">Definitions</text>
      <text x="80" y="92" text-anchor="middle" fill="#aab3ae" font-size="17">Recurring input</text>
    </g>
    <g transform="translate(250 160)">
      <rect width="160" height="130" rx="18" fill="#1d2321" stroke="#45aaa2" stroke-width="2"/>
      <text x="80" y="58" text-anchor="middle" fill="#72cfc7" font-size="22" font-weight="700">Selection</text>
      <text x="80" y="92" text-anchor="middle" fill="#aab3ae" font-size="17">Decision space</text>
    </g>
    <g transform="translate(430 160)">
      <rect width="160" height="130" rx="18" fill="#1d2321" stroke="#45aaa2" stroke-width="2"/>
      <text x="80" y="58" text-anchor="middle" fill="#72cfc7" font-size="22" font-weight="700">Arguments</text>
      <text x="80" y="92" text-anchor="middle" fill="#aab3ae" font-size="17">Structured call</text>
    </g>
    <g transform="translate(610 160)">
      <rect width="160" height="130" rx="18" fill="#1d2321" stroke="#ff9d3d" stroke-width="2"/>
      <text x="80" y="58" text-anchor="middle" fill="#ff9d3d" font-size="22" font-weight="700">Results</text>
      <text x="80" y="92" text-anchor="middle" fill="#aab3ae" font-size="17">Returned evidence</text>
    </g>
    <g transform="translate(790 160)">
      <rect width="160" height="130" rx="18" fill="#1d2321" stroke="#ff9d3d" stroke-width="2"/>
      <text x="80" y="58" text-anchor="middle" fill="#ff9d3d" font-size="22" font-weight="700">Round trips</text>
      <text x="80" y="92" text-anchor="middle" fill="#aab3ae" font-size="17">Calls + latency</text>
    </g>
    <g transform="translate(970 160)">
      <rect width="160" height="130" rx="18" fill="#1d2321" stroke="#ff6b6b" stroke-width="2"/>
      <text x="80" y="58" text-anchor="middle" fill="#ff6b6b" font-size="22" font-weight="700">Recovery</text>
      <text x="80" y="92" text-anchor="middle" fill="#aab3ae" font-size="17">Errors + retries</text>
    </g>
    <path d="M150 320 V400 H1050 V320" fill="none" stroke="#53615b" stroke-width="3"/>
    <rect x="275" y="400" width="650" height="150" rx="24" fill="#26302c" stroke="#72cfc7" stroke-width="3"/>
    <text x="600" y="460" text-anchor="middle" fill="#f4f1ea" font-size="32" font-weight="700">Useful completed work</text>
    <text x="600" y="505" text-anchor="middle" fill="#aab3ae" font-size="23">Optimize cost, correctness, latency, and control together</text>
  </g>
</svg>
