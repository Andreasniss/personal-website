<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Policy-safe model failover paths</title>
  <desc id="desc">A request is evaluated against policy before retry, backup, degraded operation, or stop.</desc>
  <rect width="1200" height="700" fill="#141817"/>
  <text x="70" y="80" fill="#f4f1ea" font-family="Georgia,serif" font-size="50">Failover is a decision table</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="160" width="260" height="100" rx="20" fill="#1d2321" stroke="#72cfc7" stroke-width="3"/>
    <text x="200" y="220" text-anchor="middle" fill="#f4f1ea" font-size="28" font-weight="700">Model failure</text>
    <path d="M330 210 H430" stroke="#72cfc7" stroke-width="4"/>
    <rect x="430" y="130" width="340" height="160" rx="22" fill="#26302c" stroke="#ff9d3d" stroke-width="3"/>
    <text x="600" y="185" text-anchor="middle" fill="#ff9d3d" font-size="24" font-weight="700">POLICY CHECK</text>
    <text x="600" y="225" text-anchor="middle" fill="#f4f1ea" font-size="23">Failure, capability, data, tools</text>
    <text x="600" y="260" text-anchor="middle" fill="#aab3ae" font-size="20">quality floor, budget, approval</text>
    <path d="M600 290 V370" stroke="#72cfc7" stroke-width="4"/>
    <path d="M150 370 H1050" stroke="#53615b" stroke-width="3"/>
    <path d="M150 370 V430 M450 370 V430 M750 370 V430 M1050 370 V430" stroke="#53615b" stroke-width="3"/>
    <rect x="55" y="430" width="190" height="125" rx="18" fill="#1d2321" stroke="#45aaa2" stroke-width="2"/>
    <text x="150" y="485" text-anchor="middle" fill="#72cfc7" font-size="26" font-weight="700">Retry</text>
    <text x="150" y="525" text-anchor="middle" fill="#aab3ae" font-size="18">Transient + bounded</text>
    <rect x="355" y="430" width="190" height="125" rx="18" fill="#1d2321" stroke="#45aaa2" stroke-width="2"/>
    <text x="450" y="485" text-anchor="middle" fill="#72cfc7" font-size="26" font-weight="700">Backup</text>
    <text x="450" y="525" text-anchor="middle" fill="#aab3ae" font-size="18">Compatible + approved</text>
    <rect x="655" y="430" width="190" height="125" rx="18" fill="#1d2321" stroke="#ff9d3d" stroke-width="2"/>
    <text x="750" y="485" text-anchor="middle" fill="#ff9d3d" font-size="26" font-weight="700">Degrade</text>
    <text x="750" y="525" text-anchor="middle" fill="#aab3ae" font-size="18">Useful without substitution</text>
    <rect x="955" y="430" width="190" height="125" rx="18" fill="#1d2321" stroke="#ff6b6b" stroke-width="2"/>
    <text x="1050" y="485" text-anchor="middle" fill="#ff6b6b" font-size="26" font-weight="700">Stop</text>
    <text x="1050" y="525" text-anchor="middle" fill="#aab3ae" font-size="18">Boundary cannot hold</text>
  </g>
</svg>
