<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Human-owned release decision</title>
  <desc id="desc">Code, tests, security, documentation, and live verification provide evidence to a human release owner.</desc>
  <rect width="1200" height="700" fill="#141817"/>
  <text x="70" y="80" fill="#f4f1ea" font-family="Georgia,serif" font-size="50">Evidence informs. The owner decides.</text>
  <g font-family="Arial,sans-serif">
    <g fill="#1d2321" stroke="#53615b" stroke-width="2">
      <rect x="60" y="160" width="190" height="90" rx="18"/>
      <rect x="280" y="160" width="190" height="90" rx="18"/>
      <rect x="500" y="160" width="190" height="90" rx="18"/>
      <rect x="720" y="160" width="190" height="90" rx="18"/>
      <rect x="940" y="160" width="190" height="90" rx="18"/>
    </g>
    <g fill="#f4f1ea" font-size="22" font-weight="700" text-anchor="middle">
      <text x="155" y="215">Code</text><text x="375" y="215">Tests + evals</text><text x="595" y="215">Security</text><text x="815" y="215">README</text><text x="1035" y="215">Live path</text>
    </g>
    <g stroke="#72cfc7" stroke-width="3">
      <path d="M155 250 V330 H600"/><path d="M375 250 V330 H600"/><path d="M595 250 V330"/><path d="M815 250 V330 H600"/><path d="M1035 250 V330 H600"/>
    </g>
    <rect x="360" y="330" width="480" height="110" rx="22" fill="#26302c" stroke="#ff9d3d" stroke-width="3"/>
    <text x="600" y="380" text-anchor="middle" fill="#ff9d3d" font-size="24" font-weight="700">CLAIM-TO-PROOF REVIEW</text>
    <text x="600" y="416" text-anchor="middle" fill="#aab3ae" font-size="20">Scope, consistency, failures, limitations</text>
    <path d="M600 440 V505" stroke="#72cfc7" stroke-width="4"/>
    <rect x="360" y="505" width="480" height="110" rx="22" fill="#45aaa2"/>
    <text x="600" y="555" text-anchor="middle" fill="#141817" font-size="28" font-weight="700">Human release decision</text>
    <text x="600" y="590" text-anchor="middle" fill="#141817" font-size="19">Intent, risk, acceptance, accountability</text>
  </g>
</svg>
