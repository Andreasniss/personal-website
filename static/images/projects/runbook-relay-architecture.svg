<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Runbook Relay architecture</title>
  <desc id="desc">A browser agent calls bounded WebMCP tools while a human operator uses page controls. Both share one deterministic state model and visible receipts. Execution passes through a human approval gate before the simulated mitigation.</desc>
  <rect width="1200" height="720" fill="#101412"/>
  <text x="76" y="82" fill="#f4f1ea" font-family="Georgia, serif" font-size="42">One state model, two actors, one approval boundary</text>
  <text x="76" y="122" fill="#aab3ae" font-family="system-ui, sans-serif" font-size="20">Runbook Relay reference architecture</text>

  <g font-family="system-ui, sans-serif">
    <rect x="76" y="190" width="250" height="114" rx="18" fill="#1d2321" stroke="#45aaa2" stroke-width="2"/>
    <text x="106" y="235" fill="#72cfc7" font-size="17" font-weight="700">BROWSER AGENT</text>
    <text x="106" y="269" fill="#f4f1ea" font-size="22">WebMCP calls</text>

    <rect x="76" y="414" width="250" height="114" rx="18" fill="#1d2321" stroke="#ff9d3d" stroke-width="2"/>
    <text x="106" y="459" fill="#ff9d3d" font-size="17" font-weight="700">HUMAN OPERATOR</text>
    <text x="106" y="493" fill="#f4f1ea" font-size="22">Page controls</text>

    <rect x="430" y="190" width="300" height="114" rx="18" fill="#1d2321" stroke="#45aaa2" stroke-width="2"/>
    <text x="460" y="235" fill="#72cfc7" font-size="17" font-weight="700">FIVE BOUNDED TOOLS</text>
    <text x="460" y="269" fill="#f4f1ea" font-size="22">Read · compare · stage</text>

    <rect x="430" y="358" width="300" height="170" rx="18" fill="#1d2321" stroke="#3a4540" stroke-width="2"/>
    <text x="460" y="403" fill="#aab3ae" font-size="17" font-weight="700">SHARED REACT STATE</text>
    <text x="460" y="440" fill="#f4f1ea" font-size="22">Incident · staged change</text>
    <text x="460" y="476" fill="#f4f1ea" font-size="22">approval · telemetry</text>

    <rect x="834" y="190" width="290" height="114" rx="18" fill="#1d2321" stroke="#3a4540" stroke-width="2"/>
    <text x="864" y="235" fill="#aab3ae" font-size="17" font-weight="700">VISIBLE EVIDENCE</text>
    <text x="864" y="269" fill="#f4f1ea" font-size="22">Receipts · decision log</text>

    <rect x="834" y="358" width="290" height="114" rx="18" fill="#1d2321" stroke="#ff9d3d" stroke-width="2"/>
    <text x="864" y="403" fill="#ff9d3d" font-size="17" font-weight="700">HUMAN APPROVAL GATE</text>
    <text x="864" y="437" fill="#f4f1ea" font-size="22">Absent? Block execution</text>

    <rect x="834" y="526" width="290" height="114" rx="18" fill="#1d2321" stroke="#45aaa2" stroke-width="2"/>
    <text x="864" y="571" fill="#72cfc7" font-size="17" font-weight="700">DETERMINISTIC EFFECT</text>
    <text x="864" y="605" fill="#f4f1ea" font-size="22">Simulated mitigation</text>

    <g fill="none" stroke="#72cfc7" stroke-width="3">
      <path d="M326 247H430"/>
      <path d="M580 304V358"/>
      <path d="M730 414H834"/>
      <path d="M979 472V526"/>
    </g>
    <g fill="none" stroke="#ff9d3d" stroke-width="3">
      <path d="M326 471H430"/>
      <path d="M730 450H834"/>
    </g>
    <g fill="none" stroke="#aab3ae" stroke-width="2" stroke-dasharray="8 8">
      <path d="M730 260H834"/>
      <path d="M730 395C780 395 784 276 834 276"/>
      <path d="M1124 583C1160 583 1160 247 1124 247"/>
    </g>
    <g fill="#72cfc7">
      <path d="M430 247l-12-7v14z"/>
      <path d="M580 358l-7-12h14z"/>
      <path d="M834 414l-12-7v14z"/>
      <path d="M979 526l-7-12h14z"/>
    </g>
    <g fill="#ff9d3d">
      <path d="M430 471l-12-7v14z"/>
      <path d="M834 450l-12-7v14z"/>
    </g>
  </g>
</svg>
